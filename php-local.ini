; Local PHP settings for multi-image uploads (up to 100 images × 10 MB).
; Used with: php -c php-local.ini artisan serve
; Prefer: ./serve.sh  (artisan serve's php -S child ignores -c)

upload_max_filesize = 12M
post_max_size = 1200M
max_file_uploads = 120
memory_limit = 1024M
max_execution_time = 600
max_input_time = 600
max_input_vars = 5000
